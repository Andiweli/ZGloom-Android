plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ast.zgloom'
    compileSdk 36

    // NDK r23c is intentionally pinned: it is the last NDK generation that
    // still supports Android API 16, which is required by the OUYA build.
    ndkVersion '23.2.8568313'

    defaultConfig {
        applicationId 'com.ast.gloomcollection'
        minSdk 16
        targetSdk 36
        versionCode 21
        versionName '09.2026'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++14 -DANDROID -D__ANDROID__'
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    flavorDimensions 'platform'
    productFlavors {
        normal {
            dimension 'platform'
            minSdk 16
        }

        automotive {
            dimension 'platform'
            minSdk 28
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

/*
 * Android Studio's Run button builds a debuggable variant.  The Automotive
 * flavor is a Play-delivery AAB target, so its debug variant is deliberately
 * disabled with the modern Android Components API.  This leaves normalDebug
 * as the only runnable debug variant and therefore the IDE default.
 */
androidComponents {
    beforeVariants(
            selector()
                    .withBuildType('debug')
                    .withFlavor('platform', 'automotive')) { variantBuilder ->
        variantBuilder.enable = false
    }
}

dependencies {
    implementation files('libs/retrotouch.aar')
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
}

// Convenience entry points; the standard Gradle tasks remain available too.
tasks.register('normalReleaseApk') {
    group = 'build'
    description = 'Build the normal Android/OUYA release APK.'
    dependsOn 'assembleNormalRelease'
}

tasks.register('automotiveReleaseBundle') {
    group = 'build'
    description = 'Build the Android Automotive release AAB.'
    dependsOn 'bundleAutomotiveRelease'
}
